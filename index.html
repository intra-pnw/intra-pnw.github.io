<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTRA — Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080700;
  --bg2:#0f0e00;
  --panel:#141200;
  --panel2:#1a1800;
  --border:#2a2600;
  --border2:#3d3800;
  --gold:#f5c400;
  --gold2:#ffd84d;
  --gold3:#a88200;
  --amber:#ffaa00;
  --text:#f0e8c8;
  --text2:#a09060;
  --text3:#5a5030;
  --red:#ff3344;
  --green:#44ff88;
  --cyan:#00ccff;
  --glow:0 0 28px rgba(245,196,0,.4);
  --glow-sm:0 0 12px rgba(245,196,0,.25);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Barlow',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* diagonal line bg */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:repeating-linear-gradient(
    -55deg,
    rgba(245,196,0,.018) 0px, rgba(245,196,0,.018) 1px,
    transparent 1px, transparent 40px
  );
}

#app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

/* ══ LOGIN WALL ══════════════════════════════════════ */
#login-wall{
  position:fixed;inset:0;z-index:500;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:1rem;
}
#login-wall.gone{display:none}

.login-box{
  width:100%;max-width:420px;
  background:var(--panel);
  border:2px solid var(--gold3);
  border-radius:4px;
  padding:2.5rem 2rem;
  text-align:center;
  box-shadow:var(--glow), inset 0 0 60px rgba(245,196,0,.03);
  position:relative;
}
/* corner accents */
.login-box::before,.login-box::after{
  content:'';position:absolute;width:16px;height:16px;
  border-color:var(--gold);border-style:solid;
}
.login-box::before{top:-2px;left:-2px;border-width:2px 0 0 2px}
.login-box::after{bottom:-2px;right:-2px;border-width:0 2px 2px 0}

.login-logo-wrap{margin-bottom:1.75rem}
/* if you have a PNG: <img id="site-logo" src="logo.png"> will show instead */
#site-logo{max-height:64px;max-width:220px;object-fit:contain;display:none}
.login-logo-text{
  font-family:'Black Ops One',sans-serif;
  font-size:3rem;letter-spacing:.12em;
  color:var(--gold);
  text-shadow:var(--glow);
  line-height:1;
}
.login-logo-sub{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:.75rem;letter-spacing:.45em;
  color:var(--text3);text-transform:uppercase;margin-top:.3rem;
}

.login-label{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:.7rem;letter-spacing:.25em;
  text-transform:uppercase;color:var(--text3);
  text-align:left;display:block;margin-bottom:.5rem;
}
.login-input{
  width:100%;background:var(--bg2);
  border:1px solid var(--border2);
  color:var(--gold2);
  border-radius:2px;padding:.7rem 1rem;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:1.05rem;letter-spacing:.15em;
  text-transform:uppercase;
  margin-bottom:.9rem;
  transition:border-color .2s,box-shadow .2s;
}
.login-input:focus{outline:none;border-color:var(--gold);box-shadow:var(--glow-sm)}
.login-input::placeholder{color:var(--text3);letter-spacing:.15em}
#login-err{color:var(--red);font-size:.78rem;min-height:1.1em;margin-bottom:.6rem;font-weight:600}

/* ══ BUTTONS ══════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.48rem 1.1rem;border-radius:2px;border:none;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;
  font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  transition:all .15s;text-decoration:none;white-space:nowrap;
}
.btn-primary{
  background:var(--gold);color:#080700;width:100%;
  justify-content:center;padding:.7rem;font-size:.9rem;
}
.btn-primary:hover{background:var(--gold2);box-shadow:var(--glow)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{color:var(--gold);border-color:var(--gold3)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(1.1)}
.btn-sm{padding:.3rem .75rem;font-size:.76rem}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* ══ HEADER ═══════════════════════════════════════════ */
header{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.8rem 1.75rem;
  border-bottom:1px solid var(--border2);
  background:rgba(8,7,0,.9);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 0 var(--border2);
}
.hdr-left{display:flex;align-items:center;gap:1rem}
/* logo in header — shows PNG if available, else text */
#hdr-logo-img{height:32px;width:auto;object-fit:contain;display:none}
.hdr-logo-text{
  font-family:'Black Ops One',sans-serif;
  font-size:1.3rem;letter-spacing:.1em;
  color:var(--gold);text-shadow:var(--glow-sm);
}
.hdr-sep{width:1px;height:22px;background:var(--border2)}

#auth-bar{display:flex;align-items:center;gap:.7rem}
.user-pill{
  display:flex;align-items:center;gap:.55rem;
  background:var(--panel);border:1px solid var(--border2);
  border-radius:2px;padding:.28rem .75rem .28rem .4rem;
}
.user-av{
  width:24px;height:24px;border-radius:1px;
  background:var(--gold3);
  display:flex;align-items:center;justify-content:center;
  font-family:'Black Ops One',sans-serif;font-size:.65rem;color:var(--bg);
}
.user-name{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:.8rem;color:var(--text2);letter-spacing:.05em;
}
.ticket-badge{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:.82rem;color:var(--gold);letter-spacing:.05em;
}

/* ══ REDEEM BAR ══════════════════════════════════════ */
.redeem-bar{
  display:flex;align-items:center;gap:.6rem;
  padding:.55rem 1.75rem;
  border-bottom:1px solid var(--border);
  background:rgba(245,196,0,.02);
}
.redeem-input{
  width:200px;background:var(--panel);border:1px solid var(--border2);
  color:var(--gold2);border-radius:2px;padding:.38rem .75rem;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:.82rem;text-transform:uppercase;letter-spacing:.12em;
  transition:border-color .2s;
}
.redeem-input:focus{outline:none;border-color:var(--gold)}
.redeem-input::placeholder{color:var(--text3)}
#redeem-msg{font-size:.76rem;font-weight:700}

/* ══ TABS ════════════════════════════════════════════ */
nav.tabs{
  display:flex;overflow-x:auto;
  border-bottom:1px solid var(--border2);
  background:var(--bg2);padding:0 1.75rem;scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none}
.tab-btn{
  padding:.7rem 1.1rem;background:none;border:none;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:.8rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--text3);border-bottom:2px solid transparent;
  transition:all .15s;white-space:nowrap;
}
.tab-btn:hover{color:var(--text2)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-btn .edate{font-size:.62rem;display:block;font-weight:400;margin-top:.05rem;letter-spacing:.05em}
.tab-btn.active .edate{color:var(--gold3)}

/* ══ MAIN ════════════════════════════════════════════ */
main{flex:1;padding:1.75rem;max-width:1080px;margin:0 auto;width:100%}

/* ══ CARDS ═══════════════════════════════════════════ */
.card{
  background:var(--panel);border:1px solid var(--border2);
  border-radius:2px;padding:1.25rem;margin-bottom:1.1rem;
  position:relative;
}
/* left accent bar */
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold3);border-radius:2px 0 0 2px}
.card-title{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:900;font-size:.78rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold3);margin-bottom:.9rem;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:680px){.grid2{grid-template-columns:1fr}}

/* ══ EVENT HEADER ════════════════════════════════════ */
.evhdr{padding:1.5rem 0 1.1rem;border-bottom:1px solid var(--border2);margin-bottom:1.5rem}
.evhdr-title{
  font-family:'Black Ops One',sans-serif;
  font-size:clamp(1.5rem,4vw,2.2rem);letter-spacing:.05em;
  color:var(--gold);text-shadow:var(--glow-sm);margin-bottom:.25rem;
}
.evhdr-date{color:var(--text3);font-size:.75rem;letter-spacing:.15em;font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase}

/* ══ COUNTDOWN ═══════════════════════════════════════ */
.cd-wrap{text-align:center;padding:3.5rem 1rem}
.cd-label{
  font-family:'Black Ops One',sans-serif;font-size:1rem;letter-spacing:.1em;
  color:var(--text2);margin-bottom:1.25rem;
}
.cd-timer{display:flex;justify-content:center;gap:.9rem;flex-wrap:wrap}
.cd-unit{
  background:var(--panel);border:1px solid var(--border2);
  border-radius:2px;padding:1rem 1.4rem;min-width:70px;
  position:relative;
}
.cd-unit::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold3)}
.cd-unit .n{
  font-family:'Black Ops One',sans-serif;font-size:2rem;
  color:var(--gold);display:block;line-height:1;text-shadow:var(--glow-sm);
}
.cd-unit .l{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:.6rem;color:var(--text3);text-transform:uppercase;
  letter-spacing:.2em;display:block;margin-top:.2rem;
}

/* ══ TABLES ═══════════════════════════════════════════ */
.rtable{width:100%;border-collapse:collapse}
.rtable th{text-align:left;color:var(--text3);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;padding:.38rem .6rem;border-bottom:1px solid var(--border2);font-family:'Barlow Condensed',sans-serif;font-weight:700}
.rtable td{padding:.45rem .6rem;border-bottom:1px solid var(--border);font-size:.83rem}
.rtable tr:last-child td{border-bottom:none}
.gold{color:var(--gold);font-weight:700}

/* ══ TRIVIA ═══════════════════════════════════════════ */
.qcard{background:var(--panel2);border:1px solid var(--border2);border-radius:2px;padding:1rem;margin-bottom:.75rem}
.qcard .qt{font-weight:700;margin-bottom:.6rem;line-height:1.5;font-size:.88rem}
.hard-tag{font-size:.62rem;background:rgba(255,170,0,.12);color:var(--amber);border:1px solid rgba(255,170,0,.3);border-radius:2px;padding:.08rem .32rem;margin-left:.35rem;vertical-align:middle;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.08em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:.38rem}
.choice{
  background:var(--panel);border:1px solid var(--border2);color:var(--text);
  border-radius:2px;padding:.48rem .8rem;cursor:pointer;
  font-family:'Barlow',sans-serif;font-size:.82rem;text-align:left;transition:all .14s;
}
.choice:hover{border-color:var(--gold3);color:var(--gold2)}
.choice.sel{border-color:var(--gold);color:var(--gold);background:rgba(245,196,0,.07)}

/* ══ BOSS ════════════════════════════════════════════ */
.boss-wrap{
  background:linear-gradient(135deg,#0d0500,#1a0800);
  border:1px solid #3a1800;border-radius:2px;padding:1.4rem;margin-bottom:1.25rem;
}
.boss-name{
  font-family:'Black Ops One',sans-serif;font-size:1.4rem;letter-spacing:.06em;
  color:var(--red);text-align:center;margin-bottom:.7rem;
  text-shadow:0 0 24px rgba(255,51,68,.35);
}
.hp-track{width:100%;height:20px;background:#1a0500;border-radius:2px;overflow:hidden;border:1px solid #3a1800}
.hp-fill{height:100%;background:linear-gradient(90deg,#7f0000,#ff3344);border-radius:2px;transition:width .5s;box-shadow:0 0 12px rgba(255,51,68,.45)}
.hp-txt{text-align:center;margin-top:.4rem;color:var(--red);font-size:.78rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.08em}
.class-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.65rem;margin:.7rem 0}
.class-btn{background:var(--panel2);border:1px solid var(--border2);border-radius:2px;padding:.9rem;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .15s;text-align:center}
.class-btn:hover{border-color:var(--gold3)}.class-btn.sel{border-color:var(--gold);box-shadow:var(--glow-sm)}
.class-icon{font-size:1.9rem;display:block;margin-bottom:.3rem}
.class-name{font-family:'Barlow Condensed',sans-serif;font-size:.85rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.class-desc{font-size:.68rem;color:var(--text2);margin-top:.12rem}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.sbar{background:var(--bg2);border-radius:2px;padding:.6rem}
.sbar .sl{font-size:.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:.15em;margin-bottom:.2rem;font-family:'Barlow Condensed',sans-serif;font-weight:700}
.sbar .st{height:5px;background:var(--border2);border-radius:2px;overflow:hidden}
.sbar .sf{height:100%;border-radius:2px;transition:width .3s}
.hp-c .sf{background:var(--green)}.mana-c .sf{background:var(--cyan)}.stam-c .sf{background:var(--gold)}
.sbar .sv{font-size:.68rem;color:var(--text2);margin-top:.2rem}
.act-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.38rem;margin-top:.85rem}
.blog{background:var(--bg2);border:1px solid var(--border);border-radius:2px;height:150px;overflow-y:auto;padding:.75rem;font-size:.74rem;color:var(--text2);line-height:1.65}
.blog div{border-bottom:1px solid rgba(245,196,0,.04);padding:.04rem 0}

/* ══ GUESS ═══════════════════════════════════════════ */
.ginput{width:100%;background:var(--panel);border:1px solid var(--border2);color:var(--text);border-radius:2px;padding:.45rem .8rem;font-family:'Barlow',sans-serif;font-size:.83rem;transition:border-color .2s}
.ginput:focus{outline:none;border-color:var(--gold)}

/* ══ CASINO ═══════════════════════════════════════════ */
.cgame{background:var(--panel);border:1px solid var(--border2);border-radius:2px;padding:1.2rem;text-align:center;position:relative}
.cgame::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold3);border-radius:2px 0 0 2px}
.cgame h3{font-family:'Black Ops One',sans-serif;font-size:.88rem;letter-spacing:.08em;color:var(--gold);margin-bottom:.65rem}
.cresult{font-size:.95rem;font-weight:700;min-height:1.5em;display:flex;align-items:center;justify-content:center;margin:.5rem 0;font-family:'Barlow Condensed',sans-serif;letter-spacing:.05em}
.binput{width:76px;background:var(--bg2);border:1px solid var(--border2);color:var(--gold2);border-radius:2px;padding:.32rem .6rem;font-family:'Barlow Condensed',sans-serif;font-size:.9rem;text-align:center;margin:.38rem}
.reels{display:flex;gap:.38rem;justify-content:center;margin:.7rem 0}
.reel{width:50px;height:50px;background:var(--bg2);border:1px solid var(--border2);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:1.55rem}
.reel.spin{animation:spin .4s ease}
@keyframes spin{0%{transform:rotateX(0)}50%{transform:rotateX(180deg)}100%{transform:rotateX(360deg)}}
.coin{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold2),var(--gold3));margin:.75rem auto;font-size:1.6rem;display:flex;align-items:center;justify-content:center;box-shadow:var(--glow-sm)}
.coin.flip{animation:cflip .8s ease}
@keyframes cflip{0%{transform:rotateY(0)}50%{transform:rotateY(900deg)}100%{transform:rotateY(1080deg)}}
.chambers{display:flex;justify-content:center;gap:.32rem;margin:.7rem 0;flex-wrap:wrap}
.chamber{width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:.95rem;transition:all .3s}
.chamber.danger{background:var(--red);border-color:var(--red);box-shadow:0 0 10px rgba(255,51,68,.45)}
.chamber.safe{background:var(--green);border-color:var(--green)}

/* ══ LEADERBOARD ══════════════════════════════════════ */
.lb-row{display:flex;align-items:center;gap:.85rem;padding:.55rem .85rem;border-bottom:1px solid var(--border)}
.lb-row:hover{background:rgba(245,196,0,.02)}
.lb-rank{width:26px;font-family:'Black Ops One',sans-serif;font-size:.82rem;color:var(--text3);text-align:center}
.lb-rank.r1{color:var(--gold)}.lb-rank.r2{color:#b0a080}.lb-rank.r3{color:#8a6a30}
.lb-name{flex:1;font-size:.85rem;font-weight:600}.lb-val{color:var(--gold);font-weight:700;font-size:.85rem;font-family:'Barlow Condensed',sans-serif;letter-spacing:.05em}

/* ══ MISC ════════════════════════════════════════════ */
.ok{color:var(--green)}.err{color:var(--red)}
.tag{display:inline-block;font-size:.65rem;font-weight:700;border-radius:2px;padding:.12rem .38rem;font-family:'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.tag-gold{background:rgba(245,196,0,.1);color:var(--gold);border:1px solid rgba(245,196,0,.25)}
.tag-dim{background:rgba(90,80,48,.2);color:var(--text3);border:1px solid var(--border2)}
.divider{border:none;border-top:1px solid var(--border2);margin:1rem 0}
.loading{color:var(--text3);text-align:center;padding:2rem;font-size:.82rem;font-style:italic;font-family:'Barlow Condensed',sans-serif;letter-spacing:.1em}
.notif{position:fixed;bottom:1.25rem;right:1.25rem;z-index:999;background:var(--panel);border:1px solid var(--border2);border-left:3px solid var(--gold);border-radius:2px;padding:.7rem 1.1rem;font-size:.8rem;font-weight:700;max-width:250px;display:none;animation:sin .25s ease;font-family:'Barlow Condensed',sans-serif;letter-spacing:.05em}
.notif.show{display:block}.notif.ok{border-left-color:var(--green);color:var(--green)}.notif.err{border-left-color:var(--red);color:var(--red)}
@keyframes sin{from{transform:translateX(110%)}to{transform:translateX(0)}}
.sav{position:fixed;top:.6rem;right:.6rem;z-index:200;background:var(--panel);border:1px solid var(--border2);border-radius:2px;padding:.25rem .7rem;font-size:.68rem;color:var(--text3);display:none;font-family:'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.sav.show{display:block}
.demo-banner{
  background:rgba(245,196,0,.07);border-bottom:1px solid rgba(245,196,0,.2);
  padding:.4rem 1.75rem;font-size:.73rem;color:var(--gold3);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  display:none;text-align:center;
}
.demo-banner.show{display:block}
</style>
</head>
<body>

<!-- ══ LOGIN WALL ══════════════════════════════════════ -->
<div id="login-wall">
  <div class="login-box">
    <div class="login-logo-wrap">
      <!-- PNG logo: place logo.png in your repo root, it auto-shows if present -->
      <img id="login-logo-img" src="logo.png" alt="INTRA" style="max-height:72px;max-width:220px;object-fit:contain;display:block;margin:0 auto"
           onerror="this.style.display='none';document.getElementById('login-logo-text').style.display='block'">
      <div class="login-logo-text" id="login-logo-text" style="display:none">INTRA</div>
      <div class="login-logo-sub">Events Portal</div>
    </div>
    <label class="login-label" for="key-in">Access Key</label>
    <input class="login-input" id="key-in" type="text" placeholder="INTRA-XXXX-XXXX" maxlength="15" autocomplete="off" spellcheck="false">
    <div id="login-err"></div>
    <button class="btn btn-primary" onclick="doLogin()">Enter →</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="hdr-left">
      <img id="hdr-logo-img" src="logo.png" alt="INTRA" style="height:30px;object-fit:contain"
           onerror="this.style.display='none';document.getElementById('hdr-logo-text').style.display='block'">
      <div class="hdr-logo-text" id="hdr-logo-text" style="display:none">INTRA</div>
      <div class="hdr-sep"></div>
    </div>
    <div id="auth-bar"></div>
  </header>
  <div class="demo-banner" id="demo-banner">⚠ DEMO MODE — nothing saves, no tickets awarded</div>
  <div class="redeem-bar">
    <input class="redeem-input" type="text" id="code-in" placeholder="REDEEM CODE" maxlength="16">
    <button class="btn btn-ghost btn-sm" onclick="handleRedeem()">Redeem 🎫</button>
    <span id="redeem-msg"></span>
  </div>

async function api(path, method="GET", body=null){
  const opts = { method, headers:{"Content-Type":"application/json"} };
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(WORKER + path, opts);
  return res.json();
}

// STATE

let me = null;           // { discord_id, username, tickets, demo }

// ══════════════════════════════════════════════════════════
// UTILS

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function showSav(v){ $("sav").className=v?"sav show":"sav" }
function notify(msg,type="ok"){
  const n=$("notif"); n.textContent=msg; n.className=`notif show ${type}`;
  clearTimeout(n._t); n._t=setTimeout(()=>n.className="notif",3500);
}
function fmtDate(d){ return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) }
function timeUntil(ds){
  const diff=new Date(ds)-Date.now(); if(diff<=0) return null;
  return {d:Math.floor(diff/86400000),h:Math.floor(diff%86400000/3600000),
          m:Math.floor(diff%3600000/60000),s:Math.floor(diff%60000/1000)};
}
function cdHTML(ds,label){
  const t=timeUntil(ds); if(!t) return "";
  return `<div class="cd-wrap"><div class="cd-label">${label}</div><div class="cd-timer">
    <div class="cd-unit"><span class="n" id="cd-d">${t.d}</span><span class="l">Days</span></div>
    <div class="cd-unit"><span class="n" id="cd-h">${t.h}</span><span class="l">Hours</span></div>
    <div class="cd-unit"><span class="n" id="cd-m">${t.m}</span><span class="l">Mins</span></div>
    <div class="cd-unit"><span class="n" id="cd-s">${t.s}</span><span class="l">Secs</span></div>
  </div></div>`;
}
function startCd(ds){
  clearInterval(cdTick);
  cdTick=setInterval(()=>{
    const t=timeUntil(ds); if(!t){clearInterval(cdTick);return}
    if($("cd-d"))$("cd-d").textContent=t.d;
    if($("cd-h"))$("cd-h").textContent=t.h;
    if($("cd-m"))$("cd-m").textContent=t.m;
    if($("cd-s"))$("cd-s").textContent=t.s;
  },1000);
}
function evHdr(ev){
  return `<div class="evhdr"><div class="evhdr-title">${ev.emoji} ${ev.title}</div>

async function doLogin(){
  const key = ($("key-in")?.value||"").trim().toUpperCase();
  if(!key){ $("login-err").textContent="Enter your key."; return; }

  // Demo key — no server call needed
  if(key === DEMO_KEY){
    me = { discord_id:"DEMO", username:"demo_user", tickets:999, demo:true };
    localStorage.setItem("intra_sess", JSON.stringify({key, discord_id:"DEMO", username:"demo_user", demo:true}));
    launch();
    return;
  }

  $("login-err").textContent="Checking…";
  try {
    const r = await api("/auth/validate","POST",{key});
    if(!r.valid){ $("login-err").textContent = r.error || "Invalid key."; return; }
    me = { discord_id: r.discord_id, username: r.username, tickets: r.tickets, demo: false };
    localStorage.setItem("intra_sess", JSON.stringify({key, discord_id:r.discord_id, username:r.username, demo:false}));
    launch();
  } catch(e){
    $("login-err").textContent="Server unreachable — try again.";
  }
}

function doLogout(){
  me=null; localStorage.removeItem("intra_sess");
  $("login-wall").classList.remove("gone");
  $("key-in").value=""; $("login-err").textContent="";
}

async function restoreSession(){
  const raw=localStorage.getItem("intra_sess"); if(!raw) return false;
  try {
    const s=JSON.parse(raw);
    if(s.demo){ me={discord_id:"DEMO",username:"demo_user",tickets:999,demo:true}; return true; }
    const r=await api("/auth/validate","POST",{key:s.key});
    if(!r.valid){ localStorage.removeItem("intra_sess"); return false; }
    me={discord_id:r.discord_id,username:r.username,tickets:r.tickets,demo:false};
    return true;
  } catch{ return false; }
}

async function renderTrivia(m){
  const ev=EVENTS.find(e=>e.id==="trivia");

  // Locked — show countdown only, no content
  if(t&&!me?.demo){ m.innerHTML=evHdr(ev)+cdHTML(ev.date,"Event starts in"); startCd(ev.date); return; }

  // Check if already submitted
  if(!me?.demo){
    const st=await api(`/trivia/status/${me.discord_id}`);
    if(st.done){
      m.innerHTML=evHdr(ev)+`<div class="card"><div class="card-title">Already Submitted</div>

      return;
    }
  }

  let html=evHdr(ev)+`<div class="card"><div class="card-title">Rules</div>

function selT(qid,val,btn){
  btn.closest(".qcard").querySelectorAll(".choice").forEach(b=>b.classList.remove("sel"));

}
async function submitTrivia(){
  if(Object.keys(triviaAns).length<TQS.length){ notify("Answer all questions first","err"); return; }
  const score=TQS.reduce((s,q)=>s+(triviaAns[q.id]===q.a?1:0),0);

  try {

    me.tickets=r.total; renderAuth();
    notify(`Submitted! ${score}/10 · +2 tickets`);

  } catch(e){ notify("Save failed","err"); }
}

  if(t&&!me?.demo){ m.innerHTML=evHdr(ev)+cdHTML(ev.date,"Event starts in"); startCd(ev.date); return; }

  if(!me?.demo){
    const st=await api(`/guessing/status/${me.discord_id}`);
    if(st.done){
      m.innerHTML=evHdr(ev)+`<div class="card"><div class="card-title">Already Submitted</div>
        <p style="color:var(--text2);font-size:.83rem">Score: <span class="gold">${st.score}/10</span></p></div>`;
      return;
    }
  }

  let html=evHdr(ev)+`<div class="card"><div class="card-title">Rules</div>
    <p style="color:var(--text2);font-size:.83rem;margin-bottom:.9rem">Guess Sumnor's real answers. If your answer contains the right word anywhere, it counts.</p>
    <table class="rtable"><thead><tr><th>Rank</th><th>Tickets</th></tr></thead><tbody>
      <tr><td>🥇 1st</td><td class="gold">+20</td></tr><tr><td>🥈 2nd</td><td class="gold">+10</td></tr>
      <tr><td>🥉 3rd</td><td class="gold">+5</td></tr><tr><td>Participation</td><td class="gold">+1</td></tr>
    </tbody></table></div>`;
  html+=GQS.map(q=>`<div class="qcard"><div class="qt">Q${q.id+1}. ${q.q}</div>
    <input class="ginput" id="g${q.id}" placeholder="Your answer…"></div>`).join("");
  html+=`<button class="btn btn-primary" style="margin-top:.9rem;max-width:220px" onclick="submitGuess()">Submit →</button>`;
  m.innerHTML=html;
}

async function submitGuess(){
  const answers={};
  GQS.forEach(q=>{ answers[q.id]=($(`g${q.id}`)?.value||"").trim().toLowerCase(); });
  const score=GQS.reduce((s,q)=>{
    const c=(GA[q.id]||"").toLowerCase();
    return s+(answers[q.id].includes(c)?1:0);
  },0);

  if(me?.demo){
    // Show results without saving
    const ev=EVENTS.find(e=>e.id==="guess");
    let html=evHdr(ev)+`<div class="card"><div class="card-title">Results (Demo) — ${score}/10</div>`;
    GQS.forEach(q=>{
      const c=(GA[q.id]||"").toLowerCase();
      const hit=(answers[q.id]||"").includes(c);
      html+=`<div style="display:flex;gap:.6rem;align-items:flex-start;padding:.42rem 0;border-bottom:1px solid var(--border)">
        <span>${hit?"✅":"❌"}</span>
        <div><div style="font-size:.78rem;color:var(--text2)">${q.q}</div>
        <div style="font-size:.72rem;color:${hit?"var(--green)":"var(--red)"}">Answer: ${GA[q.id]}</div></div></div>`;
    });
    html+=`<div style="margin-top:.9rem;color:var(--text3);font-size:.8rem">Demo mode — not saved</div></div>`;
    $("main").innerHTML=html;
    return;
  }

  try {
    const r=await api("/guessing/submit","POST",{discord_id:me.discord_id,score});
    if(r.error){ notify(r.error,"err"); return; }
    me.tickets=r.total; renderAuth();
    const ev=EVENTS.find(e=>e.id==="guess");
    let html=evHdr(ev)+`<div class="card"><div class="card-title">Results — ${score}/10</div>`;
    GQS.forEach(q=>{
      const c=(GA[q.id]||"").toLowerCase(); const hit=(answers[q.id]||"").includes(c);
      html+=`<div style="display:flex;gap:.6rem;align-items:flex-start;padding:.42rem 0;border-bottom:1px solid var(--border)">
        <span>${hit?"✅":"❌"}</span>
        <div><div style="font-size:.78rem;color:var(--text2)">${q.q}</div>
        <div style="font-size:.72rem;color:${hit?"var(--green)":"var(--red)"}">Answer: ${GA[q.id]}</div></div></div>`;
    });
    html+=`<div style="margin-top:.9rem;color:var(--gold);font-size:.8rem;font-weight:700">+1 ticket awarded</div></div>`;
    $("main").innerHTML=html;
  } catch(e){ notify("Save failed","err"); }
}

const DE=["","⚀","⚁","⚂","⚃","⚄","⚅"];

async function casinoCall(game,bet,extra={}){
  if(me?.demo){
    // Simulate locally, no save
    const won=Math.random()<.45;
    return {won, diff:won?bet:-bet, total:me.tickets+(won?bet:-bet), simulated:true, ...extra};
  }
  return api(`/casino/${game}`,"POST",{discord_id:me.discord_id,bet,...extra});
}

async function playCF(){
  const b=parseInt($("cfb")?.value)||1;
  if(!me?.demo&&me.tickets>=100){ notify("Disabled above 100 tickets","err"); return; }
  const r=await casinoCall("coinflip",b);
  if(r.error){ notify(r.error,"err"); return; }
  if(!me.demo){me.tickets=r.total;renderAuth();}
  const c=$("coin"); c.classList.add("flip"); setTimeout(()=>c.classList.remove("flip"),900);
  $("cfr").innerHTML=r.won?`<span class="ok">✅ +${b} (${r.total})</span>`:`<span class="err">❌ -${b} (${r.total})</span>`;
}

async function playSlots(){
  const b=parseInt($("slb")?.value)||1;
  const syms=["🍒","🍋","🍊","⭐","💎","7️⃣"];
  const reels=[0,1,2].map(()=>syms[Math.floor(Math.random()*syms.length)]);
  for(let i=0;i<3;i++){const e=$(`sl${i}`);if(e){e.classList.add("spin");setTimeout(()=>e.classList.remove("spin"),400+i*100);}}
  const r=await casinoCall("slots",b,{reels});
  if(r.error){ notify(r.error,"err"); return; }
  if(!me.demo){me.tickets=r.total;renderAuth();}
  setTimeout(()=>{
    (r.reels||reels).forEach((v,i)=>{const e=$(`sl${i}`);if(e)e.textContent=v;});
    $("slr").innerHTML=r.diff>0?`<span class="ok">+${r.diff} (${r.total})</span>`:`<span class="err">${r.diff} (${r.total})</span>`;
  },600);
}

async function playRR(bet,solo){
  const r=await casinoCall("roulette",bet,{solo});
  if(r.error){ notify(r.error,"err"); return; }
  if(!me.demo){me.tickets=r.total;renderAuth();}
  const chamber=r.chamber||(r.won?Math.floor(Math.random()*5)+2:1);
  document.querySelectorAll(".chamber").forEach((el,i)=>{el.className="chamber";el.textContent="🔵";
    if(i===chamber-1){el.classList.add(r.won?"safe":"danger");el.textContent=r.won?"✅":"💥";}});
  $("rrr").innerHTML=r.won?`<span class="ok">Survived! +${Math.abs(r.diff)} (${r.total})</span>`:`<span class="err">💀 BANG! -${Math.abs(r.diff)} (${r.total})</span>`;
}

async function playDice(){
  const b=parseInt($("db")?.value)||1;
  const roll=1+Math.floor(Math.random()*6);
  const r=await casinoCall("dice",b,{roll});
  if(r.error){ notify(r.error,"err"); return; }
  if(!me.demo){me.tickets=r.total;renderAuth();}
  $("dicedisplay").textContent=DE[r.roll||roll];
  $("dr").innerHTML=r.won?`<span class="ok">Rolled ${r.roll||roll}! +${Math.abs(r.diff)} (${r.total})</span>`:`<span class="err">Rolled ${r.roll||roll}. -${Math.abs(r.diff)} (${r.total})</span>`;
}

async function renderLB(m){
  m.innerHTML=`<div class="evhdr"><div class="evhdr-title">🏆 Leaderboard</div></div><div class="loading">Loading…</div>`;
  try {
    const lb=await api("/tickets/leaderboard");
    let html=`<div class="evhdr"><div class="evhdr-title">🏆 Leaderboard</div></div><div class="card">`;
    if(!lb.length) html+=`<p style="color:var(--text3);font-size:.83rem;padding:.5rem">No entries yet.</p>`;
    lb.forEach((row,i)=>{
      const rc=i===0?"r1":i===1?"r2":i===2?"r3":"";
      const isMe=!me?.demo&&me?.discord_id===row.discord_id;
      html+=`<div class="lb-row" style="${isMe?"background:rgba(245,196,0,.03)":""}">
        <div class="lb-rank ${rc}">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</div>
        <div class="lb-name">${isMe?`<span class="gold">@${row.username}</span>`:row.username||row.discord_id}${isMe?` <span class="tag tag-gold">You</span>`:""}</div>
        <div class="lb-val">🎫 ${row.tickets}</div>
      </div>`;
    });
    m.innerHTML=html+`</div>`;
  } catch{ m.innerHTML=`<p style="color:var(--red);padding:2rem">Failed to load leaderboard.</p>`; }
}
