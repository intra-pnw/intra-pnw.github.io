<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTRA — Events Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #07080d;
  --bg2:       #0d0f1a;
  --bg3:       #11142a;
  --panel:     #141728;
  --panel2:    #1a1e35;
  --border:    #2a2f52;
  --border2:   #3a4080;
  --gold:      #f0c040;
  --gold2:     #ffd97d;
  --cyan:      #00e5ff;
  --purple:    #a855f7;
  --red:       #ff4466;
  --green:     #22d984;
  --text:      #e8eaf6;
  --text2:     #9fa8da;
  --text3:     #5c6484;
  --shadow:    0 0 40px rgba(0,229,255,.08), 0 4px 24px rgba(0,0,0,.6);
  --glow-gold: 0 0 20px rgba(240,192,64,.4);
  --glow-cyan: 0 0 20px rgba(0,229,255,.4);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Exo 2', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Stars background ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(168,85,247,.06) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(0,229,255,.05) 0%, transparent 60%);
  pointer-events: none;
}

.stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 30% 40%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(2px 2px at 90% 30%, rgba(240,192,64,.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 15% 70%, rgba(0,229,255,.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 85%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 80% 5%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 65% 25%, rgba(168,85,247,.5) 0%, transparent 100%);
}

/* ── Layout ── */
#app { position: relative; z-index: 1; }

header {
  padding: 2rem 2rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(180deg, rgba(20,23,40,.9) 0%, transparent 100%);
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(12px);
}

.logo {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.2rem, 3vw, 1.8rem);
  font-weight: 900;
  background: linear-gradient(135deg, var(--gold) 0%, var(--cyan) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: .1em;
  text-shadow: none;
  filter: drop-shadow(0 0 12px rgba(240,192,64,.3));
}

.logo span { color: var(--text2); font-size: .6em; font-family: 'Exo 2', sans-serif;
  -webkit-text-fill-color: var(--text2); font-weight: 300; letter-spacing: .3em; display: block; }

/* ── Auth bar ── */
#auth-bar { display: flex; align-items: center; gap: 1rem; }

.btn {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .55rem 1.2rem; border-radius: 8px; border: none; cursor: pointer;
  font-family: 'Exo 2', sans-serif; font-size: .9rem; font-weight: 600;
  transition: all .2s; text-decoration: none; white-space: nowrap;
}
.btn-discord { background: #5865F2; color: #fff; }
.btn-discord:hover { background: #4752c4; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(88,101,242,.4); }
.btn-gold { background: var(--gold); color: #1a1200; }
.btn-gold:hover { background: var(--gold2); transform: translateY(-1px); box-shadow: var(--glow-gold); }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border2); }
.btn-ghost:hover { color: var(--text); border-color: var(--cyan); background: rgba(0,229,255,.05); }
.btn-red { background: var(--red); color: #fff; }
.btn-red:hover { background: #ff2255; transform: translateY(-1px); }
.btn-green { background: var(--green); color: #071a10; }
.btn-green:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-sm { padding: .35rem .8rem; font-size: .8rem; }

.ticket-badge {
  display: flex; align-items: center; gap: .4rem;
  background: var(--panel); border: 1px solid var(--gold);
  border-radius: 8px; padding: .4rem .8rem;
  color: var(--gold); font-weight: 700; font-size: .95rem;
}

.avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--cyan); }

/* ── Tab Nav ── */
nav.tabs {
  display: flex; overflow-x: auto; gap: 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg2); padding: 0 2rem;
  scrollbar-width: none;
}
nav.tabs::-webkit-scrollbar { display: none; }

.tab-btn {
  padding: 1rem 1.5rem; background: none; border: none; cursor: pointer;
  font-family: 'Exo 2', sans-serif; font-size: .9rem; font-weight: 600;
  color: var(--text3); position: relative; white-space: nowrap;
  border-bottom: 3px solid transparent; transition: all .2s;
}
.tab-btn:hover { color: var(--text2); }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab-btn .event-date { font-size: .7rem; color: var(--text3); display: block; font-weight: 300; }
.tab-btn.active .event-date { color: var(--gold2); }

/* ── Redeem bar ── */
.redeem-bar {
  display: flex; gap: .75rem; align-items: center; padding: 1rem 2rem;
  background: linear-gradient(90deg, rgba(240,192,64,.04) 0%, transparent 100%);
  border-bottom: 1px solid var(--border);
}
.redeem-bar input {
  flex: 1; max-width: 320px;
  background: var(--panel); border: 1px solid var(--border2);
  color: var(--text); border-radius: 8px; padding: .55rem 1rem;
  font-family: 'Exo 2', sans-serif; font-size: .9rem;
  text-transform: uppercase; letter-spacing: .1em;
  transition: border-color .2s;
}
.redeem-bar input:focus { outline: none; border-color: var(--gold); box-shadow: var(--glow-gold); }
.redeem-bar input::placeholder { color: var(--text3); letter-spacing: .1em; }

#redeem-msg { font-size: .85rem; font-weight: 600; }
.ok { color: var(--green); } .err { color: var(--red); }

/* ── Main content ── */
main { padding: 2rem; max-width: 1200px; margin: 0 auto; }

/* ── Countdown ── */
.countdown-wrap {
  text-align: center; padding: 3rem 2rem;
}
.countdown-label {
  font-family: 'Cinzel Decorative', serif;
  font-size: 1.4rem; color: var(--text2); margin-bottom: 1rem;
}
.countdown-timer {
  display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;
}
.countdown-unit {
  background: var(--panel); border: 1px solid var(--border2);
  border-radius: 12px; padding: 1.5rem 2rem; min-width: 90px;
  box-shadow: var(--shadow);
}
.countdown-unit .num {
  font-family: 'Cinzel Decorative', serif;
  font-size: 2.5rem; color: var(--gold);
  display: block; line-height: 1;
  text-shadow: var(--glow-gold);
}
.countdown-unit .lbl {
  font-size: .7rem; color: var(--text3); letter-spacing: .15em; text-transform: uppercase; display: block; margin-top: .3rem;
}

/* ── Event panels ── */
.event-panel { display: none; animation: fadeIn .3s ease; }
.event-panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.event-header {
  padding: 2.5rem 0 1.5rem;
  border-bottom: 1px solid var(--border); margin-bottom: 2rem;
}
.event-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.6rem, 4vw, 2.5rem);
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: .5rem;
}
.event-date-label { color: var(--text3); font-size: .9rem; letter-spacing: .1em; }

/* ── Cards / grid ── */
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem;
  box-shadow: var(--shadow); transition: border-color .2s;
}
.card:hover { border-color: var(--border2); }
.card h3 { color: var(--gold); font-family: 'Cinzel Decorative', serif; font-size: 1rem; margin-bottom: 1rem; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
@media (max-width: 768px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

/* ── Rewards table ── */
.rewards-table { width: 100%; border-collapse: collapse; }
.rewards-table th { text-align: left; color: var(--text3); font-size: .8rem;
  letter-spacing: .1em; padding: .5rem .75rem; border-bottom: 1px solid var(--border); }
.rewards-table td { padding: .6rem .75rem; border-bottom: 1px solid var(--border); font-size: .9rem; }
.rewards-table tr:last-child td { border-bottom: none; }
.gold-text { color: var(--gold); font-weight: 700; }

/* ── Trivia ── */
.question-card {
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
}
.question-card .q-text { font-weight: 600; margin-bottom: .75rem; line-height: 1.5; }
.question-card .hard-tag {
  font-size: .7rem; background: rgba(168,85,247,.2); color: var(--purple);
  border: 1px solid rgba(168,85,247,.4); border-radius: 4px; padding: .1rem .4rem;
  margin-left: .5rem; vertical-align: middle;
}
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.choice-btn {
  background: var(--panel); border: 1px solid var(--border2);
  color: var(--text); border-radius: 8px; padding: .6rem 1rem;
  cursor: pointer; font-family: 'Exo 2', sans-serif; font-size: .85rem;
  text-align: left; transition: all .2s;
}
.choice-btn:hover { border-color: var(--cyan); background: rgba(0,229,255,.05); }
.choice-btn.selected { border-color: var(--gold); background: rgba(240,192,64,.1); color: var(--gold); }

/* ── Boss Raid ── */
.boss-hp-bar-wrap {
  background: #1a0a0a; border: 1px solid #5a1a1a; border-radius: 12px;
  padding: 1.5rem; margin-bottom: 2rem;
}
.boss-name {
  font-family: 'Cinzel Decorative', serif; font-size: 1.8rem; color: var(--red);
  text-align: center; margin-bottom: .75rem;
  text-shadow: 0 0 30px rgba(255,68,102,.4);
}
.hp-bar-track {
  width: 100%; height: 28px; background: #2a0a0a; border-radius: 8px; overflow: hidden;
  border: 1px solid #5a1a1a;
}
.hp-bar-fill {
  height: 100%; background: linear-gradient(90deg, #7f0000, #ff4466);
  border-radius: 8px; transition: width .5s ease;
  box-shadow: 0 0 16px rgba(255,68,102,.6);
}
.hp-text { text-align: center; margin-top: .5rem; color: var(--red); font-size: .9rem; }

.class-selector { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 1rem 0; }
.class-btn {
  background: var(--panel2); border: 2px solid var(--border);
  border-radius: 12px; padding: 1.25rem; cursor: pointer;
  font-family: 'Exo 2', sans-serif; transition: all .2s; text-align: center;
}
.class-btn:hover { border-color: var(--cyan); }
.class-btn.selected { border-color: var(--gold); box-shadow: var(--glow-gold); }
.class-icon { font-size: 2.5rem; display: block; margin-bottom: .5rem; }
.class-name { font-size: 1rem; font-weight: 700; color: var(--text); }
.class-desc { font-size: .75rem; color: var(--text2); margin-top: .25rem; }

.player-stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem;
}
.stat-bar { background: var(--panel); border-radius: 8px; padding: .75rem; }
.stat-bar .stat-lbl { font-size: .7rem; color: var(--text3); margin-bottom: .3rem; text-transform: uppercase; letter-spacing: .1em; }
.stat-bar .stat-track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.stat-bar .stat-fill { height: 100%; border-radius: 4px; transition: width .3s; }
.stat-bar.hp .stat-fill { background: var(--green); }
.stat-bar.mana .stat-fill { background: var(--cyan); }
.stat-bar.stamina .stat-fill { background: var(--gold); }
.stat-bar .stat-val { font-size: .8rem; color: var(--text2); margin-top: .3rem; }

.action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; margin-top: 1rem; }
@media (max-width: 600px) { .action-grid { grid-template-columns: 1fr; } }

.battle-log {
  background: #0a0c18; border: 1px solid var(--border); border-radius: 8px;
  height: 200px; overflow-y: auto; padding: 1rem;
  font-size: .82rem; color: var(--text2); line-height: 1.8;
}
.battle-log .log-entry { padding: .1rem 0; border-bottom: 1px solid rgba(255,255,255,.03); }
.battle-log .log-entry.dmg { color: #ff8899; }
.battle-log .log-entry.heal { color: var(--green); }
.battle-log .log-entry.buff { color: var(--cyan); }

/* ── Guessing ── */
.guess-input {
  width: 100%; background: var(--panel); border: 1px solid var(--border2);
  color: var(--text); border-radius: 8px; padding: .55rem 1rem;
  font-family: 'Exo 2', sans-serif; font-size: .9rem; transition: border-color .2s;
}
.guess-input:focus { outline: none; border-color: var(--cyan); }

/* ── Event 4 ── */
.event4-message {
  background: var(--panel); border: 1px solid var(--border2);
  border-radius: 16px; padding: 3rem 2rem; text-align: center;
  box-shadow: var(--shadow);
}
.event4-message h2 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.4rem, 3vw, 2rem);
  background: linear-gradient(135deg, var(--gold), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 1.5rem;
}
.event4-message p { color: var(--text2); line-height: 1.9; max-width: 640px; margin: 0 auto .75rem; }

/* ── Casino ── */
.casino-game {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 16px; padding: 1.5rem; text-align: center;
}
.casino-game h3 {
  font-family: 'Cinzel Decorative', serif; font-size: 1.1rem;
  color: var(--gold); margin-bottom: 1rem;
}
.casino-result {
  font-size: 1.2rem; font-weight: 700; min-height: 2em;
  display: flex; align-items: center; justify-content: center;
  margin: .75rem 0;
}
.bet-input {
  width: 100px; background: var(--panel2); border: 1px solid var(--border2);
  color: var(--text); border-radius: 8px; padding: .4rem .75rem;
  font-family: 'Exo 2', sans-serif; font-size: 1rem; text-align: center;
  margin: .5rem;
}

/* ── Slots ── */
.slot-reels { display: flex; gap: .5rem; justify-content: center; margin: 1rem 0; }
.slot-reel {
  width: 64px; height: 64px; background: var(--bg);
  border: 2px solid var(--border2); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem;
  transition: all .3s;
}
.slot-reel.spin { animation: spin .4s ease; }
@keyframes spin { 0%{transform:rotateX(0)} 50%{transform:rotateX(180deg)} 100%{transform:rotateX(360deg)} }

/* ── Coin flip ── */
.coin {
  width: 80px; height: 80px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), #b8860b);
  margin: 1rem auto; font-size: 2rem; display: flex;
  align-items: center; justify-content: center;
  box-shadow: var(--glow-gold);
  transition: transform .5s;
}
.coin.flip { animation: coinFlip .8s ease; }
@keyframes coinFlip {
  0%{transform:rotateY(0)}  50%{transform:rotateY(900deg)}  100%{transform:rotateY(1080deg)}
}

/* ── Roulette ── */
.chambers {
  display: flex; justify-content: center; gap: .4rem; margin: 1rem 0; flex-wrap: wrap;
}
.chamber {
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid var(--border2); background: var(--panel2);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; transition: all .3s;
}
.chamber.danger { background: var(--red); border-color: var(--red); box-shadow: 0 0 12px rgba(255,68,102,.6); }
.chamber.safe   { background: var(--green); border-color: var(--green); }

/* ── Leaderboard ── */
.lb-row {
  display: flex; align-items: center; gap: 1rem; padding: .7rem 1rem;
  border-bottom: 1px solid var(--border); transition: background .2s;
}
.lb-row:hover { background: rgba(255,255,255,.02); }
.lb-rank { width: 32px; font-family: 'Cinzel Decorative', serif;
  font-size: 1rem; color: var(--text3); text-align: center; }
.lb-rank.r1 { color: var(--gold); }
.lb-rank.r2 { color: #c0c0c0; }
.lb-rank.r3 { color: #cd7f32; }
.lb-name { flex: 1; font-weight: 600; }
.lb-val { color: var(--gold); font-weight: 700; }

/* ── Login gate ── */
.login-gate {
  text-align: center; padding: 4rem 2rem;
}
.login-gate h2 {
  font-family: 'Cinzel Decorative', serif; color: var(--gold);
  margin-bottom: 1rem;
}
.login-gate p { color: var(--text2); margin-bottom: 2rem; }

/* ── Misc ── */
.tag {
  display: inline-block; font-size: .75rem; font-weight: 600;
  border-radius: 4px; padding: .2rem .5rem; margin-bottom: .5rem;
}
.tag-cyan { background: rgba(0,229,255,.1); color: var(--cyan); border: 1px solid rgba(0,229,255,.3); }
.tag-gold { background: rgba(240,192,64,.1); color: var(--gold); border: 1px solid rgba(240,192,64,.3); }
.tag-purple { background: rgba(168,85,247,.1); color: var(--purple); border: 1px solid rgba(168,85,247,.3); }

.divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

.loading { color: var(--text3); text-align: center; padding: 2rem; font-style: italic; }

.notif {
  position: fixed; bottom: 2rem; right: 2rem; z-index: 999;
  background: var(--panel); border: 1px solid var(--border2);
  border-radius: 12px; padding: 1rem 1.5rem;
  font-size: .9rem; font-weight: 600; max-width: 300px;
  box-shadow: var(--shadow); animation: slideIn .3s ease;
  display: none;
}
.notif.show { display: block; }
.notif.ok { border-color: var(--green); color: var(--green); }
.notif.err { border-color: var(--red); color: var(--red); }
@keyframes slideIn { from{transform:translateX(120%)} to{transform:translateX(0)} }
</style>
</head>
<body>
<div class="stars"></div>
<div id="app">
  <!-- ── Header ── -->
  <header>
    <div>
      <div class="logo">INTRA<span>Events Portal</span></div>
    </div>
    <div id="auth-bar">
      <div id="auth-loading" class="loading" style="padding:.5rem">Loading…</div>
    </div>
  </header>

  <!-- ── Redeem bar ── -->
  <div class="redeem-bar">
    <input type="text" id="code-input" placeholder="ENTER CODE" maxlength="16">
    <button class="btn btn-gold btn-sm" onclick="handleRedeem()">🎫 Redeem</button>
    <span id="redeem-msg"></span>
  </div>

  <!-- ── Tabs ── -->
  <nav class="tabs" id="tabs-nav"></nav>

  <!-- ── Main ── -->
  <main id="main-content"></main>
</div>

<!-- Notification -->
<div class="notif" id="notif"></div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const API = "https://your-backend.onrender.com"; // ← Change this

// ── Events config ────────────────────────────────────────────────────────────
const EVENTS = [
  { id: "trivia",  title: "Trivia Night",         date: "2025-06-05T00:00:00", emoji: "🧠" },
  { id: "boss",    title: "Boss Raid",             date: "2025-06-10T00:00:00", emoji: "⚔️" },
  { id: "guess",   title: "Guessing Games",        date: "2025-06-15T00:00:00", emoji: "🎯" },
  { id: "breather","title": "Breathe In, Breathe Out", date: "2025-06-20T00:00:00", emoji: "💨" },
  { id: "casino",  title: "Casino Night",          date: "2025-06-25T00:00:00", emoji: "🎰" },
];

// ── State ────────────────────────────────────────────────────────────────────
let currentUser  = null;
let activeTab    = null;
let triviaState  = { answers: {}, submitted: false };
let guessingState= { answers: {}, submitted: false };
let bossState    = null;
let bossPlayer   = null;
let bossPolling  = null;

// ── Utilities ────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function notify(msg, type = "ok") {
  const n = $("notif");
  n.textContent = msg; n.className = `notif show ${type}`;
  clearTimeout(n._t);
  n._t = setTimeout(() => n.className = "notif", 3500);
}

async function apiFetch(path, method = "GET", body = null) {
  const opts = { method, credentials: "include", headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  return res.json();
}

function formatDate(d) {
  return new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
}

function timeUntil(dateStr) {
  const diff = new Date(dateStr) - Date.now();
  if (diff <= 0) return null;
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  return { d, h, m, s, diff };
}

function countdownHTML(dateStr, label) {
  const t = timeUntil(dateStr);
  if (!t) return "";
  return `
  <div class="countdown-wrap">
    <div class="countdown-label">${label}</div>
    <div class="countdown-timer" id="cdTimer">
      <div class="countdown-unit"><span class="num" id="cd-d">${t.d}</span><span class="lbl">Days</span></div>
      <div class="countdown-unit"><span class="num" id="cd-h">${t.h}</span><span class="lbl">Hours</span></div>
      <div class="countdown-unit"><span class="num" id="cd-m">${t.m}</span><span class="lbl">Minutes</span></div>
      <div class="countdown-unit"><span class="num" id="cd-s">${t.s}</span><span class="lbl">Seconds</span></div>
    </div>
  </div>`;
}

function tickCountdown(dateStr) {
  const t = timeUntil(dateStr);
  if (!t) return;
  if ($("cd-d")) $("cd-d").textContent = t.d;
  if ($("cd-h")) $("cd-h").textContent = t.h;
  if ($("cd-m")) $("cd-m").textContent = t.m;
  if ($("cd-s")) $("cd-s").textContent = t.s;
}

function buildTabs() {
  const nav = $("tabs-nav");
  const now = Date.now();
  nav.innerHTML = `<button class="tab-btn ${activeTab === "home" ? "active" : ""}" onclick="showTab('home')">
    🏠 Home</button>` +
    EVENTS.map(e => {
      const past    = new Date(e.date) < new Date(now - 86400000);
      if (past) return ""; // Remove tab day after event
      return `<button class="tab-btn ${activeTab === e.id ? "active" : ""}" onclick="showTab('${e.id}')">
        ${e.emoji} ${e.title}<span class="event-date">${formatDate(e.date)}</span></button>`;
    }).join("") +
    `<button class="tab-btn ${activeTab === "leaderboard" ? "active" : ""}" onclick="showTab('leaderboard')">
      🏆 Leaderboard</button>`;
}

function showTab(id) {
  activeTab = id;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => {
    if (b.textContent.includes(EVENTS.find(e=>e.id===id)?.title || id) || 
        (id === "home" && b.textContent.includes("🏠")) ||
        (id === "leaderboard" && b.textContent.includes("🏆"))) {
      b.classList.add("active");
    }
  });
  clearInterval(bossPolling);
  const main = $("main-content");
  switch (id) {
    case "home":       main.innerHTML = renderHome(); break;
    case "trivia":     renderTrivia(main); break;
    case "boss":       renderBoss(main); break;
    case "guess":      renderGuess(main); break;
    case "breather":   main.innerHTML = renderBreather(); break;
    case "casino":     main.innerHTML = renderCasino(); break;
    case "leaderboard":renderLeaderboard(main); break;
    default: main.innerHTML = "<p>Coming soon.</p>";
  }
  if (id !== "boss") clearInterval(bossPolling);
}

async function submitTrivia() {
  const qs = await apiFetch("/api/trivia/questions");
  if (Object.keys(triviaState.answers).length < (Array.isArray(qs) ? qs.length : 10)) {
    notify("Answer all questions first!", "err"); return;

  const res = await apiFetch("/api/trivia/submit", "POST", { answers: triviaState.answers });

  triviaState.submitted = true;

  if (res.boss_hit) notify(`Boss hit you for ${res.boss_hit}! ❤️ ${res.your_hp} HP left`, "err");
  await refreshBossState();

async function refreshBossState() {
  const s = await apiFetch("/api/boss/state");
  bossState = s;
  const fill = $("boss-hp-fill");
  const txt  = $("boss-hp-text");
  if (fill) fill.style.width = `${Math.max(0, s.hp/s.max_hp*100)}%`;
  if (txt)  txt.textContent = `${s.hp.toLocaleString()} / ${s.max_hp.toLocaleString()} HP`;

  if (log) {
    log.innerHTML = (s.log || []).slice(-20).reverse().map(l => `<div class="log-entry">${l}</div>`).join("");
  }

    <h3>🎰 House Rules</h3>
    <p style="color:var(--text2)">Gamble your tickets. Coin flip only works if you have fewer than 100 tickets. Solo games yield smaller rewards. Play smart!</p>
  </div>
  <div class="grid2">
    <!-- Coin Flip -->
    <div class="casino-game">
      <h3>🪙 Coin Flip</h3>
      <p style="color:var(--text3);font-size:.8rem">Doubles your bet — only if you have &lt;100 tickets</p>
      <div class="coin" id="coin">🪙</div>
      <div class="casino-result" id="cf-result">—</div>
      <input class="bet-input" type="number" id="cf-bet" value="1" min="1">
      <button class="btn btn-gold btn-sm" onclick="playCoinFlip()">Flip!</button>
    </div>

    <!-- Slots -->
    <div class="casino-game">
      <h3>🎰 Slots</h3>
      <p style="color:var(--text3);font-size:.8rem">3 of a kind = 3× | 💎💎💎 = 5× | 2 match = 0.5×</p>
      <div class="slot-reels">
        <div class="slot-reel" id="sl0">🍒</div><div class="slot-reel" id="sl1">🍋</div><div class="slot-reel" id="sl2">🍊</div>
      </div>
      <div class="casino-result" id="sl-result">—</div>
      <input class="bet-input" type="number" id="sl-bet" value="1" min="1">
      <button class="btn btn-gold btn-sm" onclick="playSlots()">Spin!</button>
    </div>

    <!-- Russian Roulette -->
    <div class="casino-game">
      <h3>🔫 Russian Roulette</h3>
      <p style="color:var(--text3);font-size:.8rem">Solo: win = +bet | Multi (bet 5): win = +25 tickets</p>
      <div class="chambers" id="chambers">
        ${Array.from({length:6},(_,i)=>`<div class="chamber" id="ch${i}">🔵</div>`).join("")}
      </div>
      <div class="casino-result" id="rr-result">—</div>
      <div style="display:flex;gap:.5rem;justify-content:center;margin-top:.5rem;flex-wrap:wrap">
        <button class="btn btn-red btn-sm" onclick="playRoulette(1,true)">Solo (bet 1)</button>
        <button class="btn btn-gold btn-sm" onclick="playRoulette(5,false)">Multiplayer (bet 5)</button>
      </div>
    </div>

    <!-- Dice -->
    <div class="casino-game">
      <h3>🎲 High Dice</h3>
      <p style="color:var(--text3);font-size:.8rem">Roll 5 or 6 → win 1.5× your bet</p>
      <div style="font-size:3rem;margin:1rem 0" id="dice-display">🎲</div>
      <div class="casino-result" id="dice-result">—</div>
      <input class="bet-input" type="number" id="dice-bet" value="1" min="1">
      <button class="btn btn-gold btn-sm" onclick="playDice()">Roll!</button>
    </div>
  </div>`;
}

const DICE_EMOJI = ["","⚀","⚁","⚂","⚃","⚄","⚅"];

async function playCoinFlip() {
  const bet = parseInt($("cf-bet")?.value) || 1;
  const res = await apiFetch("/api/casino/coinflip", "POST", { bet });
  if (res.error) { notify(res.error, "err"); return; }
  const coin = $("coin");
  coin.classList.add("flip");
  setTimeout(() => coin.classList.remove("flip"), 900);
  $("cf-result").innerHTML = res.won
    ? `<span class="ok">✅ ${res.result.toUpperCase()}! +${Math.abs(res.diff)} tickets (${res.total} total)</span>`
    : `<span class="err">❌ ${res.result.toUpperCase()}! -${Math.abs(res.diff)} tickets (${res.total} total)</span>`;
  updateTicketBadge(res.total);
}

async function playSlots() {
  const bet = parseInt($("sl-bet")?.value) || 1;
  for (let i=0;i<3;i++) { const el=$(`sl${i}`); if(el){el.classList.add("spin"); setTimeout(()=>el.classList.remove("spin"),400+i*100);} }
  const res = await apiFetch("/api/casino/slots", "POST", { bet });
  if (res.error) { notify(res.error, "err"); return; }
  setTimeout(() => {
    res.reels.forEach((r,i) => { const el=$(`sl${i}`); if(el) el.textContent=r; });
    $("sl-result").innerHTML = res.diff > 0
      ? `<span class="ok">+${res.diff} tickets! (${res.total} total)</span>`
      : `<span class="err">${res.diff} tickets (${res.total} total)</span>`;
    updateTicketBadge(res.total);
  }, 600);
}

async function playRoulette(bet, solo) {
  const res = await apiFetch("/api/casino/roulette", "POST", { bet, solo });
  if (res.error) { notify(res.error, "err"); return; }
  const ch = document.querySelectorAll(".chamber");
  ch.forEach((c,i) => {
    c.className = "chamber";
    c.textContent = "🔵";
    if (i === res.chamber - 1) {
      c.classList.add(res.survived ? "safe" : "danger");
      c.textContent = res.survived ? "✅" : "💥";
    }
  });
  $("rr-result").innerHTML = res.survived
    ? `<span class="ok">Survived! +${Math.abs(res.diff)} tickets (${res.total} total)</span>`
    : `<span class="err">💀 BANG! -${Math.abs(res.diff)} tickets (${res.total} total)</span>`;
  updateTicketBadge(res.total);
}

async function playDice() {
  const bet = parseInt($("dice-bet")?.value) || 1;
  const res = await apiFetch("/api/casino/dice", "POST", { bet });
  if (res.error) { notify(res.error, "err"); return; }
  $("dice-display").textContent = DICE_EMOJI[res.roll] || "🎲";
  $("dice-result").innerHTML = res.won
    ? `<span class="ok">Rolled ${res.roll}! +${Math.abs(res.diff)} tickets (${res.total} total)</span>`
    : `<span class="err">Rolled ${res.roll}. -${Math.abs(res.diff)} tickets (${res.total} total)</span>`;
  updateTicketBadge(res.total);
}

// ── Leaderboard ───────────────────────────────────────────────────────────────
async function renderLeaderboard(main) {
  main.innerHTML = `<div class="event-header"><div class="event-title">🏆 Leaderboard</div></div><div class="loading">Loading…</div>`;
  const lb = await apiFetch("/api/tickets/leaderboard");
  let html = `<div class="event-header"><div class="event-title">🏆 Global Leaderboard</div></div>
    <div class="card">`;
  lb.forEach((row, i) => {
    const rankClass = i === 0 ? "r1" : i === 1 ? "r2" : i === 2 ? "r3" : "";
    html += `<div class="lb-row">
      <div class="lb-rank ${rankClass}">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</div>
      <div class="lb-name">User ${row.uid.slice(-4)}</div>
      <div class="lb-val">🎫 ${row.tickets}</div>
    </div>`;
  });
  html += `</div>`;
  main.innerHTML = html;
}

// ── Redeem code ───────────────────────────────────────────────────────────────
async function handleRedeem() {
  if (!currentUser) { notify("Login with Discord first!", "err"); return; }
  const code = $("code-input")?.value?.trim();
  if (!code) return;
  const msg = $("redeem-msg");
  msg.textContent = "Checking…"; msg.className = "";
  const res = await apiFetch("/api/redeem", "POST", { code }).catch(e => e);
  if (res.ok) {
    msg.textContent = `✅ +${res.reward} tickets! (${res.total} total)`;
    msg.className = "ok";
    updateTicketBadge(res.total);
    notify(`Code redeemed! +${res.reward} tickets 🎫`);
    if ($("code-input")) $("code-input").value = "";
  } else {
    msg.textContent = `❌ ${res.error || "Invalid code"}`;
    msg.className = "err";
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function updateTicketBadge(n) {
  const badge = document.querySelector(".ticket-badge");
  if (badge) badge.textContent = `🎫 ${n}`;
}

function eventHeader(ev) {
  return `<div class="event-header">
    <div class="event-title">${ev.emoji} ${ev.title}</div>
    <div class="event-date-label">📅 ${formatDate(ev.date)}</div>
  </div>`;
}

let cdInterval = null;
function startCdTick(dateStr) {
  clearInterval(cdInterval);
  cdInterval = setInterval(() => tickCountdown(dateStr), 1000);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
$("auth-loading").style.display = "none";
loadUser();

// Enter key for redeem
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.activeElement?.id === "code-input") handleRedeem();
});
</script>
</body>
