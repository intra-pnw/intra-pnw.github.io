<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTRA — Events Room</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080700;--bg2:#0f0d00;--panel:#131100;--panel2:#191600;
  --border:#252200;--border2:#3a3500;--border3:#554f00;
  --gold:#f5c400;--gold2:#ffd84d;--gold3:#a88200;--amber:#ffaa00;
  --text:#f0e8c8;--text2:#a09060;--text3:#5a5030;
  --red:#ff3344;--green:#44ff88;--cyan:#00ccff;--purple:#c084fc;
  --glow:0 0 28px rgba(245,196,0,.35);--glow-sm:0 0 12px rgba(245,196,0,.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}
#app{display:flex;flex-direction:column;min-height:100vh}

/* LOGIN WALL */
#login-wall{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center}
#login-wall.gone{display:none}
.lbox{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border3);padding:2rem;text-align:center;box-shadow:var(--glow)}
.llogo{font-family:'Black Ops One',sans-serif;font-size:2.5rem;color:var(--gold)}
.linput{width:100%;background:var(--bg2);border:1px solid var(--border2);color:#fff;padding:.6rem;margin:.8rem 0;font-size:1rem;text-align:center}

header{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border2);background:var(--bg2)}
.hdr-logo{font-family:'Black Ops One',sans-serif;font-size:1.5rem;color:var(--gold)}
nav.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--border2);padding:0 2rem}
.tab-btn{padding:.8rem 1.2rem;background:none;border:none;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer}
.tab-btn.active{color:var(--gold);border-bottom:2px solid var(--gold)}

main{flex:1;padding:2rem;max-width:1100px;margin:0 auto;width:100%}
.card{background:var(--panel);border:1px solid var(--border2);padding:1.5rem;margin-bottom:1.5rem;position:relative}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}

/* RULE PAGE SETUP */
.rules-container{text-align:center;padding:2rem 1rem}
.rules-title{font-family:'Black Ops One',sans-serif;font-size:1.8rem;color:var(--gold);margin-bottom:1rem}
.rules-text{color:var(--text2);font-size:1.05rem;line-height:1.6;margin-bottom:2rem;max-width:600px;margin-left:auto;margin-right:auto}

/* QUESTIONS & WINDOW CARDS */
.qcard{background:var(--panel2);border:1px solid var(--border2);padding:1.5rem;border-radius:4px;margin-top:1rem}
.choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1rem}
.choice-btn{background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:.75rem;font-weight:600;cursor:pointer;text-align:left}
.choice-btn:hover{border-color:var(--gold)}
.choice-btn.selected{background:rgba(245,196,0,0.15);border-color:var(--gold)}

/* MULTI WINDOW CASINO ROOM ARCHITECTURE */
.casino-dashboard{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem;margin-top:1rem}
@media(max-width:768px){.casino-dashboard{grid-template-columns:1fr}}
.game-window{background:var(--panel2);border:1px solid var(--border3);padding:1.2rem;position:relative}
.game-window h4{font-family:'Black Ops One',sans-serif;color:var(--gold);margin-bottom:.5rem;border-bottom:1px solid var(--border2);padding-bottom:.3rem}
.game-action-row{margin-top:1rem;display:flex;gap:.5rem;align-items:center}

.btn{padding:.5rem 1rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;cursor:pointer;border:none}
.btn-primary{background:var(--gold);color:#000}.btn-primary:hover{background:var(--gold2)}
.btn-secondary{background:var(--border3);color:#fff}
.input-num{background:var(--bg);border:1px solid var(--border2);color:var(--gold);padding:.4rem;width:70px;text-align:center}
.feedback{font-size:.85rem;margin-top:.5rem;color:var(--cyan);min-height:1.2rem}
</style>
</head>
<body>

<div id="app">
  <div id="login-wall">
    <div class="lbox">
      <div class="llogo">INTRA</div>
      <div style="color:var(--text3); font-size:.8rem; margin-bottom:1rem">SECURE ACCESS HUB</div>
      <input type="text" id="passkey" class="linput" placeholder="ENTER ACCESS KEY (OR 'DEMO')" value="DEMO">
      <button class="btn btn-primary" onclick="attemptLogin()">INITIALIZE ACCESS</button>
      <p id="lerr" style="color:var(--red); font-size:.8rem; margin-top:.5rem"></p>
    </div>
  </div>

  <header>
    <div class="hdr-logo">INTRA SYSTEM</div>
    <div style="display:flex; gap:1.5rem; align-items:center">
      <div id="user-display" class="gold">Connecting...</div>
      <div id="tickets-display" style="color:var(--cyan)">[T] --</div>
    </div>
  </header>

  <nav class="tabs" id="event-tabs"></nav>

  <main id="main-content">
    <div style="text-align:center; padding:4rem; color:var(--text3)">Please select an active module tab above.</div>
  </main>
</div>

<script>
let API_URL = window.location.origin; // Dynamically binds locally or through workers tunnels proxy
let me = null;
let activeEventId = null;
let visibleEvents = [];

// Pagination state variables for rule templates and questions sequence tracking
let triviaState = { stage: 'rules', currentIdx: 0, questions: [], selectedAnswer: null };
let guessState = { stage: 'rules', currentIdx: 0, questions: [], currentInput: '' };

// Sprites extension tracking object configuration loaded dynamically
let spriteConfig = {};

async function attemptLogin() {
  const key = document.getElementById("passkey").value;
  try {
    const res = await fetch(`${API_URL}/api/auth`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key })
    });
    if(!res.ok) throw new Error("Unauthorized token ring context.");
    me = await res.json();
    document.getElementById("login-wall").classList.add("gone");
    document.getElementById("user-display").innerText = `@${me.username}`;
    document.getElementById("tickets-display").innerText = `[T] ${me.tickets}`;
    
    // Once authorized, load up dynamically populated non-spoiled events list
    await fetchActiveEvents();
  } catch(e) {
    document.getElementById("lerr").innerText = e.message;
  }
}

async function fetchActiveEvents() {
  const url = `${API_URL}/api/events?demo=${me.demo ? 'true' : 'false'}`;
  const res = await fetch(url);
  visibleEvents = await res.json();
  
  // Also fetch the asset paths dynamically to understand extensions config (.gif vs .png fallbacks)
  const spriteRes = await fetch(`${API_URL}/api/boss/config`);
  spriteConfig = await spriteRes.json();
  
  renderTabs();
}

function renderTabs() {
  const tabsContainer = document.getElementById("event-tabs");
  tabsContainer.innerHTML = "";
  visibleEvents.forEach(ev => {
    const btn = document.createElement("button");
    btn.className = `tab-btn ${activeEventId === ev.id ? 'active' : ''}`;
    btn.innerText = ev.title;
    btn.onclick = () => switchModule(ev.id);
    tabsContainer.appendChild(btn);
  });
  if(visibleEvents.length && !activeEventId) {
    switchModule(visibleEvents[0].id);
  }
}

function switchModule(id) {
  activeEventId = id;
  renderTabs();
  
  const container = document.getElementById("main-content");
  container.innerHTML = "";
  
  if(id === "trivia") {
    renderTriviaModule(container);
  } else if(id === "guess") {
    renderGuessModule(container);
  } else if(id === "boss") {
    renderBossModule(container);
  } else if(id === "casino") {
    renderCasinoModule(container);
  } else {
    container.innerHTML = `<div class="card"><h3>${id.toUpperCase()}</h3><p style='color:var(--text2); margin-top:0.5rem'>Module layout workspace initialization complete.</p></div>`;
  }
}

// ── 4. TRIVIA ARCHITECTURE: PAGE 1 RULES -> PAGE PRO QUESTION WITH REVEALS ──
async function renderTriviaModule(m) {
  if(triviaState.questions.length === 0) {
    const res = await fetch(`${API_URL}/api/trivia/questions`);
    triviaState.questions = await res.json();
  }
  
  if(triviaState.stage === 'rules') {
    m.innerHTML = `
      <div class="card rules-container">
        <div class="rules-title">Trivia Night Regulations</div>
        <p class="rules-text">Welcome to the Arena. You will face a sequence of challenging multiple choice questions. Standard tier awards 50 points; Elite Hard tier grants 100 points. No turning back once loaded.</p>
        <button class="btn btn-primary" onclick="triviaState.stage='quiz'; switchModule('trivia')">ACCEPT & BEGIN</button>
      </div>`;
    return;
  }
  
  const q = triviaState.questions[triviaState.currentIdx];
  if(!q) {
    m.innerHTML = `<div class="card" style="text-align:center"><h3>Trivia Complete!</h3><p style="margin-top:1rem; color:var(--text2)">All answers successfully processed by centralized backend logging.</p></div>`;
    return;
  }
  
  m.innerHTML = `
    <div class="card">
      <div style="font-size:0.8rem; color:var(--text3)">QUESTION ${triviaState.currentIdx + 1} OF ${triviaState.questions.length} ${q.hard ? '<span style="color:var(--amber)">[HARD]</span>':''}</div>
      <div class="qcard">
        <h3 style="font-family:'Barlow'; font-size:1.2rem; color:#fff">${q.q}</h3>
        <div class="choices-grid" id="trivia-options"></div>
      </div>
      <div id="trivia-feedback" class="feedback"></div>
      <div class="game-action-row" style="justify-content:flex-end">
        <button class="btn btn-primary" id="trivia-submit-btn" disabled onclick="submitTriviaChoice(${q.id})">Lock Answer</button>
        <button class="btn btn-secondary" style="display:none" id="trivia-next-btn" onclick="triviaState.currentIdx++; triviaState.selectedAnswer=null; switchModule('trivia')">Next Question ➔</button>
      </div>
    </div>`;
    
  const optsContainer = document.getElementById("trivia-options");
  q.choices.forEach(choice => {
    const b = document.createElement("button");
    b.className = "choice-btn";
    b.innerText = choice;
    b.onclick = () => {
      document.querySelectorAll(".choice-btn").forEach(el => el.classList.remove("selected"));
      b.classList.add("selected");
      triviaState.selectedAnswer = choice;
      document.getElementById("trivia-submit-btn").removeAttribute("disabled");
    };
    optsContainer.appendChild(b);
  });
}

async function submitTriviaChoice(qid) {
  document.getElementById("trivia-submit-btn").style.display = "none";
  const choice = triviaState.selectedAnswer;
  
  const res = await fetch(`${API_URL}/api/trivia/submit`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ qid, answer: choice, discord_id: me.discord_id })
  });
  const data = await res.json();
  if(!me.demo) { me.tickets = data.total; document.getElementById("tickets-display").innerText = `[T] ${me.tickets}`; }
  
  const fb = document.getElementById("trivia-feedback");
  if(data.correct) {
    fb.innerHTML = `<span style="color:var(--green)">CORRECT! +${data.reward} Tickets logged.</span>`;
  } else {
    fb.innerHTML = `<span style="color:var(--red)">INCORRECT. Real Answer: ${data.correct_answer}. +${data.reward} participation tokens added.</span>`;
  }
  document.getElementById("trivia-next-btn").style.display = "inline-block";
}

// ── 4. GUESS THE ANSWER ARCHITECTURE: RULES PAGE -> PAGE PRO QUESTION WITH TOP GUESS STATS ──
async function renderGuessModule(m) {
  if(guessState.questions.length === 0) {
    const res = await fetch(`${API_URL}/api/guess/questions`);
    guessState.questions = await res.json();
  }
  
  if(guessState.stage === 'rules') {
    m.innerHTML = `
      <div class="card rules-container">
        <div class="rules-title">Guessing Game Protocol</div>
        <p class="rules-text">Can you see through thoughts? Input your text submission guess directly into the query string parameter handler. It reveals the exact correct matching index accompanied by global telemetry polling charts.</p>
        <button class="btn btn-primary" onclick="guessState.stage='quiz'; switchModule('guess')">BOOT INTERFACE</button>
      </div>`;
    return;
  }
  
  const q = guessState.questions[guessState.currentIdx];
  if(!q) {
    m.innerHTML = `<div class="card" style="text-align:center"><h3>Guesses Complete!</h3><p style="margin-top:1rem; color:var(--text2)">Telemetries fully aligned with parameters storage pool database.</p></div>`;
    return;
  }
  
  m.innerHTML = `
    <div class="card">
      <div style="font-size:0.8rem; color:var(--text3)">QUERY STEP ${guessState.currentIdx + 1} OF ${guessState.questions.length}</div>
      <div class="qcard">
        <h3 style="font-family:'Barlow'; font-size:1.1rem; color:var(--gold2)">${q.q}</h3>
        <input type="text" id="guess-input-field" class="linput" style="text-align:left; padding-left:1rem; margin-top:1.2rem; margin-bottom:0px" placeholder="Type answer here..." value="${guessState.currentInput}">
      </div>
      <div id="guess-feedback" class="feedback" style="margin-top:1rem"></div>
      <div class="game-action-row" style="justify-content:flex-end">
        <button class="btn btn-primary" id="guess-submit-btn" onclick="submitGuessQuery(${q.id})">Transmit Analysis</button>
        <button class="btn btn-secondary" style="display:none" id="guess-next-btn" onclick="guessState.currentIdx++; guessState.currentInput=''; switchModule('guess')">Next Prompt ➔</button>
      </div>
    </div>`;
}

async function submitGuessQuery(qid) {
  const val = document.getElementById("guess-input-field").value.trim();
  if(!val) return;
  guessState.currentInput = val;
  document.getElementById("guess-submit-btn").style.display = "none";
  
  const res = await fetch(`${API_URL}/api/guess/submit`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ qid, answer: val, discord_id: me.discord_id })
  });
  const data = await res.json();
  if(!me.demo) { me.tickets = data.total; document.getElementById("tickets-display").innerText = `[T] ${me.tickets}`; }
  
  const fb = document.getElementById("guess-feedback");
  let statsHtml = `<div style="margin-top:0.6rem; color:var(--text2); font-size:0.8rem"><b>Most Guessed Answers For This Prompt:</b><br/>` + data.top_guesses.join(" | ") + `</div>`;
  
  if(data.correct) {
    fb.innerHTML = `<span style="color:var(--green)">EXACT MATCH! Perfect score +${data.reward} Tickets.</span>` + statsHtml;
  } else {
    fb.innerHTML = `<span style="color:var(--red)">NO MATCH. Target baseline configuration was: <b>${data.correct_answer}</b>. Saved submission.</span>` + statsHtml;
  }
  document.getElementById("guess-next-btn").style.display = "inline-block";
}

// ── 1. ANIMATION CANVAS MANAGER (.gif & .png asset fallbacks for Cthulhu and Characters) ──
function renderBossModule(m) {
  m.innerHTML = `
    <div class="card">
      <div class="rules-title" style="text-align:left; font-size:1.3rem; margin-bottom:0.5rem">Boss Raid Environment Monitoring</div>
      <p style="color:var(--text2); font-size:0.85rem; margin-bottom:1rem">Rendering live frames pipeline directly matching loaded fallback tags config maps.</p>
      
      <div style="background:#020202; border:1px solid var(--border3); height:240px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative">
         <img id="boss-sprite-frame" src="${spriteConfig.boss_idle}" style="height:140px; object-fit:contain; transition:transform 0.1s">
         <img id="cthulhu-sprite-frame" src="${spriteConfig.cthulhu_idle}" style="height:140px; object-fit:contain; display:none">
         <div id="fx-layer" style="position:absolute; inset:0; pointer-events:none; display:none; background-size:cover"></div>
         <div id="boss-hp-tag" style="margin-top:1rem; color:var(--red); font-family:'Black Ops One'; font-size:1.1rem">500,000 / 500,000 HP</div>
      </div>
      
      <div class="choices-grid" style="grid-template-columns: repeat(3, 1fr); margin-top:1rem">
        <button class="btn btn-secondary" onclick="triggerVisualEffect('attack')">EXECUTE ATTACK</button>
        <button class="btn btn-secondary" onclick="triggerVisualEffect('flinch')">TRIGGER FLINCH</button>
        <button class="btn btn-secondary" onclick="toggleCthulhuTarget()">SWAP TO CTHULHU</button>
      </div>
    </div>`;
}

function triggerVisualEffect(type) {
  const isCthulhu = document.getElementById("cthulhu-sprite-frame").style.display === "block";
  const frame = document.getElementById(isCthulhu ? "cthulhu-sprite-frame" : "boss-sprite-frame");
  
  if(type === 'flinch') {
    frame.src = isCthulhu ? spriteConfig.cthulhu_flinch : spriteConfig.boss_flinch;
    setTimeout(() => {
      frame.src = isCthulhu ? spriteConfig.cthulhu_idle : spriteConfig.boss_idle;
    }, 800);
  } else if(type === 'attack') {
    frame.src = isCthulhu ? spriteConfig.cthulhu_attack : spriteConfig.boss_attack;
    const fx = document.getElementById("fx-layer");
    fx.style.backgroundImage = `url('${spriteConfig.fx_slash}')`;
    fx.style.display = "block";
    setTimeout(() => {
      frame.src = isCthulhu ? spriteConfig.cthulhu_idle : spriteConfig.boss_idle;
      fx.style.display = "none";
    }, 700);
  }
}

function toggleCthulhuTarget() {
  const b = document.getElementById("boss-sprite-frame");
  const c = document.getElementById("cthulhu-sprite-frame");
  if(c.style.display === "none") {
    b.style.display = "none"; c.style.display = "block";
  } else {
    b.style.display = "block"; c.style.display = "none";
  }
}

// ── 5 & 6. CASINO NIGHT INTERFACE ARCHITECTURE: MULTIPLE WINDOW PANELS ──
function renderCasinoModule(m) {
  m.innerHTML = `
    <div class="evhdr" style="padding-top:0px">
      <div class="evtitle">Casino Night Dashboard</div>
      <div class="evdate">Multi-Game Concurrent Windows Active (Invited by Default to all rooms)</div>
    </div>
    
    <div class="casino-dashboard">
      <div class="game-window" id="win-russian">
        <h4>☠ Russian Roulette</h4>
        <div style="font-size:0.75rem; color:var(--text3); margin-bottom:0.5rem">Solo multiplier goes up to x4 (5 bullets max)</div>
        
        <div style="margin-bottom:0.6rem">
          <label style="font-size:0.7rem; display:block; color:var(--text2)">MODE:</label>
          <select id="rr-mode" class="linput" style="padding:.3rem; font-size:.8rem; margin: .2rem 0" onchange="toggleRRBulletsDisplay()">
            <option value="solo">Solo Execution (Pick Chamber Count)</option>
            <option value="duo">Duo Showdown (Trigger Pulling Duel)</option>
          </select>
        </div>
        
        <div id="rr-bullets-wrap" style="margin-bottom:0.6rem">
          <label style="font-size:0.7rem; display:block; color:var(--text2)">BULLETS TO LOAD (1-5):</label>
          <input type="number" id="rr-bullets" class="input-num" style="width:100%" value="1" min="1" max="5">
        </div>
        
        <div>
          <label style="font-size:0.7rem; display:block; color:var(--text2)">BET TICKETS:</label>
          <input type="number" id="rr-bet" class="input-num" style="width:100%" value="100">
        </div>
        
        <div id="rr-feedback" class="feedback"></div>
        <div class="game-action-row">
          <button class="btn btn-primary" onclick="playRussianRoulette()">PULL TRIGGER</button>
        </div>
      </div>
      
      <div class="game-window" id="win-blackjack">
        <h4>🃏 Blackjack Matrix</h4>
        <div style="font-size:0.75rem; color:var(--text3); margin-bottom:0.5rem">Dealer stands on soft 17 baseline engine</div>
        
        <div style="margin-bottom:0.6rem">
          <label style="font-size:0.7rem; display:block; color:var(--text2)">BET TICKETS:</label>
          <input type="number" id="bj-bet" class="input-num" style="width:100%" value="100">
        </div>
        
        <div id="bj-feedback" class="feedback"></div>
        <div class="game-action-row">
          <button class="btn btn-primary" onclick="playBlackjack()">DEAL HAND</button>
        </div>
      </div>
      
      <div class="game-window" id="win-roulette">
        <h4>🎡 Wheel Roulette (Group Betting Hub)</h4>
        <div style="font-size:0.75rem; color:var(--text3); margin-bottom:0.5rem">Betting synchronous or group aligned targeting</div>
        
        <div style="margin-bottom:0.6rem">
          <label style="font-size:0.7rem; display:block; color:var(--text2)">TARGET SELECTION:</label>
          <select id="wheel-target" class="linput" style="padding:.3rem; font-size:.8rem; margin:.2rem 0">
            <option value="red">RED CHIPS (1:1 payout)</option>
            <option value="black">BLACK CHIPS (1:1 payout)</option>
            <option value="green">GREEN CHAMBER 0 (35:1 payout)</option>
          </select>
        </div>
        
        <div style="margin-bottom:0.6rem">
          <label style="font-size:0.7rem; display:block; color:var(--text2)">BET TICKETS:</label>
          <input type="number" id="wheel-bet" class="input-num" style="width:100%" value="50">
        </div>
        
        <div id="wheel-feedback" class="feedback"></div>
        <div class="game-action-row">
          <button class="btn btn-primary" onclick="playWheelRoulette()">SPIN WHEEL</button>
        </div>
      </div>
    </div>`;
}

function toggleRRBulletsDisplay() {
  const mode = document.getElementById("rr-mode").value;
  document.getElementById("rr-bullets-wrap").style.display = mode === 'solo' ? 'block' : 'none';
}

async function playRussianRoulette() {
  const mode = document.getElementById("rr-mode").value;
  const bullets = document.getElementById("rr-bullets").value;
  const bet = document.getElementById("rr-bet").value;
  const fb = document.getElementById("rr-feedback");
  fb.innerText = "Spinning chamber cylinder...";
  
  const res = await fetch(`${API_URL}/api/casino/play`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ game: `russian_${mode}`, bullets, bet, discord_id: me.discord_id })
  });
  const data = await res.json();
  if(data.error) { fb.innerText = data.error; return; }
  
  if(!me.demo) { me.tickets = data.total; document.getElementById("tickets-display").innerText = `[T] ${me.tickets}`; }
  fb.innerHTML = `<span style="color:${data.won ? 'var(--green)':'var(--red)'}">${data.msg} Balance diff: ${data.diff}</span>`;
}

async function playBlackjack() {
  const bet = document.getElementById("bj-bet").value;
  const fb = document.getElementById("bj-feedback");
  fb.innerText = "Shuffling and distributing cards...";
  
  const res = await fetch(`${API_URL}/api/casino/play`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ game: "blackjack", bet, discord_id: me.discord_id })
  });
  const data = await res.json();
  if(data.error) { fb.innerText = data.error; return; }
  
  if(!me.demo) { me.tickets = data.total; document.getElementById("tickets-display").innerText = `[T] ${me.tickets}`; }
  let color = data.push ? 'var(--gold)' : (data.won ? 'var(--green)' : 'var(--red)');
  fb.innerHTML = `<span style="color:${color}">${data.msg} (Player: ${data.player} | Dealer: ${data.dealer})</span>`;
}

async function playWheelRoulette() {
  const target = document.getElementById("wheel-target").value;
  const bet = document.getElementById("wheel-bet").value;
  const fb = document.getElementById("wheel-feedback");
  fb.innerText = "Releasing ball into drop frame...";
  
  const res = await fetch(`${API_URL}/api/casino/play`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ game: "roulette_settle", bet_on: target, bet, discord_id: me.discord_id })
  });
  const data = await res.json();
  if(data.error) { fb.innerText = data.error; return; }
  
  if(!me.demo) { me.tickets = data.total; document.getElementById("tickets-display").innerText = `[T] ${me.tickets}`; }
  fb.innerHTML = `<span style="color:${data.won?'var(--green)':'var(--red)'}">Landed on ${data.number} (${data.color.toUpperCase()}). ${data.won ? 'Winner!':'House Wins.'} Payout: ${data.diff}</span>`;
}
</script>
